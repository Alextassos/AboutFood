<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Food - Account</title>
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body>

<!-- Κουμπί Επιστροφής στην Αρχική -->
<a href="/index.html" class="btn-back-home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Back to Home</span>
</a>

<!-- Κρυφοί διακόπτες (Radio Buttons) για την εναλλαγή των φορμών χωρίς JavaScript -->
<input type="radio" name="auth-toggle" id="tab-signin" {{if not .ShowSignup}}checked{{end}} style="display: none;">
<input type="radio" name="auth-toggle" id="tab-signup" {{if .ShowSignup}}checked{{end}} style="display: none;">

<div class="auth-wrapper">
    <div class="auth-card">
        
        <!-- Tabs Εναλλαγής μεταξύ Sign In και Sign Up -->
        <div class="auth-tabs">
            <label for="tab-signin" class="tab-label label-signin">log In</label>
            <label for="tab-signup" class="tab-label label-signup">Sign Up</label>
        </div>

        <!-- ==================== ΦΟΡΜΑ SIGN IN (LOGIN) ==================== -->
        <form action="/login" method="POST" class="auth-form form-signin">
            {{if .Error}}<p class="auth-error" role="alert">{{.Error}}</p>{{end}}
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <div class="input-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" name="email" placeholder="enter your email" required>
            </div>

            <div class="input-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" placeholder="enter your password" required>
            </div>

            <button type="submit" class="btn-auth-submit">Sign In</button>
            
            <div class="auth-forgot">
                <a href="/forgot">Forgot password?</a>
            </div>
        </form>

        <!-- ==================== ΦΟΡΜΑ SIGN UP (REGISTER) ==================== -->
        <form action="/register" method="POST" class="auth-form form-signup">
            {{if .Error}}<p class="auth-error" role="alert">{{.Error}}</p>{{end}}
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <div class="input-group">
                <label for="reg-name">Full Name / Company Name</label>
                <input type="text" id="reg-name" name="name" placeholder="enter your name" required>
            </div>

            <div class="input-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" name="email" placeholder="enter your email" required>
            </div>

            <div class="input-group">
                <label for="reg-role">I want to join as a</label>
                <select id="reg-role" name="role" class="select-role">
                    <option value="customer">Customer / Buyer</option>
                    <option value="supplier">Supplier / Producer</option>
                </select>
            </div>

            <div class="input-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" name="password" minlength="8" maxlength="72" placeholder="create a password" required>
                <small class="password-hint">At least 8 characters, one uppercase letter, and one symbol (such as ! or @).</small>
            </div>

            <button type="submit" class="btn-auth-submit">Create Account</button>
        </form>

    </div>
</div>

</body>
</html>
